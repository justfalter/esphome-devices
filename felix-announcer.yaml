esphome:
  name: felix-announcer
esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret host_domain
  fast_connect: true
  power_save_mode: LIGHT

network:
  enable_high_performance: false

http_request:
  verify_ssl: false

ota:
  platform: esphome
  password: !secret ota_password

safe_mode:
  num_attempts: 3

api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: INFO

# MAX98357 I2S DAC/amp breakout.
# BCLK -> GPIO26, LRC/WS -> GPIO25, DIN -> GPIO27
# SD (shutdown) left floating/tied high on the breakout to keep the amp enabled.
i2s_audio:
  i2s_lrclk_pin: GPIO25
  i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: felix_speaker
    dac_type: external
    i2s_dout_pin: GPIO27
    channel: mono

media_player:
  - platform: speaker
    name: announcer
    codec_support_enabled: false
    announcement_pipeline:
      speaker: felix_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 1
    buffer_size: 4000
